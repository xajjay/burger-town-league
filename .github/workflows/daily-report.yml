name: BTL Daily Report

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional: tell the bot exactly what to report on (leave blank for a random daily pick)'
        required: false
        type: string
      queue_for_next_run:
        description: 'Check this to SAVE the topic for the next scheduled run instead of posting right now'
        required: false
        type: boolean
        default: false

permissions:
  contents: write # needed so the bot can commit its own history.json / next-topic.txt updates

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate and post today's report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_GENERAL: ${{ secrets.DISCORD_WEBHOOK_URL_GENERAL }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
          MANUAL_TOPIC: ${{ github.event.inputs.topic }}
          QUEUE_FOR_NEXT_RUN: ${{ github.event.inputs.queue_for_next_run }}
        run: node scripts/daily-report/generate-report.mjs

      - name: Save updated history / queued topic
        run: |
          git config user.name "btl-daily-report-bot"
          git config user.email "actions@github.com"
          git add scripts/daily-report/history.json scripts/daily-report/next-topic.txt
          git diff --quiet --cached && echo "Nothing to save" && exit 0
          git commit -m "Update daily report state [skip ci]"
          # If someone pushed to main while the report was generating, rebase onto it and retry
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 5))
          done
          exit 1

