name: BTL Daily Report

on:
  schedule:
    # Runs at 8:00 PM Eastern. GitHub Actions cron is UTC only:
    # 00:00 UTC = 8:00 PM EDT (roughly March-November, covers now)
    # 01:00 UTC = 8:00 PM EST (roughly November-March)
    # This is set for EDT — once clocks fall back to EST in November, this will
    # fire at 7:00 PM Eastern instead unless you change it to '0 1 * * *'.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional: tell the bot exactly what to report on (leave blank for a random daily pick)'
        required: false
        type: string
      queue_for_next_run:
        description: 'Check this to SAVE the topic for the next scheduled run instead of posting right now'
        required: false
        type: boolean
        default: false

permissions:
  contents: write # needed so the bot can commit its own history.json / next-topic.txt updates

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate and post today's report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_GENERAL: ${{ secrets.DISCORD_WEBHOOK_URL_GENERAL }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
          MANUAL_TOPIC: ${{ github.event.inputs.topic }}
          QUEUE_FOR_NEXT_RUN: ${{ github.event.inputs.queue_for_next_run }}
        run: node scripts/daily-report/generate-report.mjs

      - name: Save updated history / queued topic
        run: |
          git config user.name "btl-daily-report-bot"
          git config user.email "actions@github.com"
          git add scripts/daily-report/history.json scripts/daily-report/next-topic.txt
          git diff --quiet --cached || git commit -m "Update daily report state [skip ci]"
          git push

